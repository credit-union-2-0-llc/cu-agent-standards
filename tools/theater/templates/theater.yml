# Copy to .github/workflows/theater.yml in any CU2 repo. This is the whole file.
#
# The gate is a RATCHET: it fails only on verification theater the change
# introduces, and ignores whatever the repo already carries. Green on arrival by
# construction, so adopting it does not require cleaning up first.
#
# FORGE_BUILD_APP_ID / FORGE_BUILD_PRIVATE_KEY are organisation secrets with
# visibility "all", so nothing needs configuring per repo.
#
# NOT `secrets: inherit`. That hands the called workflow EVERY secret this repo
# has, when it needs exactly two. semgrep's
# yaml.github-actions.security.secrets-inherit rule flags it, correctly — it is a
# supply-chain over-grant. Naming the two is the same number of lines.

name: Theater gate

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  theater:
    uses: credit-union-2-0-llc/cu2-standards/.github/workflows/reusable-theater.yml@main
    secrets:
      FORGE_BUILD_APP_ID: ${{ secrets.FORGE_BUILD_APP_ID }}
      FORGE_BUILD_PRIVATE_KEY: ${{ secrets.FORGE_BUILD_PRIVATE_KEY }}
