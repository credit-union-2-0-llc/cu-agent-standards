# Copy to .github/workflows/theater.yml in any repository. This is the whole file.
#
# The gate is a RATCHET: it fails only on verification theater the change
# introduces, and ignores whatever the repo already carries. Green on arrival by
# construction, so adopting it does not require cleaning up first.
#
# No secrets, no tokens, no organisation settings — the source repo is public.

name: Theater gate

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  theater:
    uses: credit-union-2-0-llc/cu-agent-standards/.github/workflows/reusable-theater.yml@main
