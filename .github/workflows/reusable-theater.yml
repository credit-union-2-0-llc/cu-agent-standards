# ─────────────────────────────────────────────────────────────────────────────
# Theater Gate — reusable workflow
#
# Blocks verification theater INTRODUCED BY A CHANGE, and ignores the standing
# backlog. That is what makes it adoptable: a gate that failed on a repository's
# existing findings could never be switched on, and an un-switched-on gate is
# worth nothing.
#
# Usage in any repository — the whole of it:
#
#   name: Theater gate
#   on:
#     push: { branches: [main] }
#     pull_request: {}
#   jobs:
#     theater:
#       uses: credit-union-2-0-llc/cu-agent-standards/.github/workflows/reusable-theater.yml@main
#
# No secrets, no tokens, no organisation settings. This source repository is
# public, so a caller of any visibility can use it — which is the point: a
# PRIVATE source cannot be called by public or internal repositories at all,
# and that restriction surfaces as a zero-job run with no log and no annotation.
#
# WHY REUSABLE RATHER THAN A COPIED FILE. The detector has been wrong eleven
# times and will be wrong again. Vendoring it into every repository means each
# fix needs a pull request per repository, and the copies drift. Here the caller
# gets four lines and a correction propagates on merge.
#
# See tools/theater/README.md for the detectors, the declared-suppression
# convention, and the ledger of the twenty times this toolchain lied to us.
# ─────────────────────────────────────────────────────────────────────────────

name: Theater Gate (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "gate (T1,T2,T3,T4,T6,T8) or all (adds T5, skipped tests)"
        type: string
        default: gate
      standards-ref:
        description: >-
          Override the ref this workflow takes the detector from. Leave empty
          (the default) to track main.
        type: string
        default: ""
      report-backlog:
        description: "Print the repo's standing backlog (non-blocking)"
        type: boolean
        default: true

jobs:
  theater:
    name: Theater gate (ratchet)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. Ratchet mode resolves a base
      # ref to compute the diff, and a shallow clone cannot. The scanner exits 2
      # naming this setting rather than degrading to "no changes".
      - name: Checkout caller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # No token: this repository is public, so the caller's own GITHUB_TOKEN
      # reads it. `github.job_workflow_sha` would version-lock the detector to
      # this exact file, but it comes through empty in this context, so the
      # chain falls back to main.
      - name: Fetch the detector
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: credit-union-2-0-llc/cu-agent-standards
          ref: ${{ inputs.standards-ref != '' && inputs.standards-ref || (github.job_workflow_sha != '' && github.job_workflow_sha || 'main') }}
          path: .cu2-theater
          sparse-checkout: tools/theater
          fetch-depth: 1

      # FAIL CLOSED ON A MISSING DETECTOR.
      #
      # If the checkout above half-succeeds — wrong ref, a sparse pattern that
      # matches nothing, a rename upstream — the next step would run nothing and
      # the job would go green. Every adopting repository would then carry a
      # passing "Theater gate" badge for a gate that never executed, which is a
      # more perfect instance of this defect class than anything the detector
      # looks for. So the file's presence is asserted, and its own test suite
      # runs before it is trusted to judge anyone else's code.
      - name: Verify the detector arrived and is sane
        run: |
          set -euo pipefail
          SCAN=.cu2-theater/tools/theater/theater_scan.py
          if [ ! -f "$SCAN" ]; then
            echo "::error::$SCAN not found — the cu-agent-standards checkout did"
            echo "::error::not deliver the detector. Refusing to report a pass."
            ls -R .cu2-theater 2>/dev/null | head -40 || echo "(.cu2-theater absent)"
            exit 2
          fi
          echo "detector: $(git -C .cu2-theater rev-parse --short HEAD) ($(wc -l < "$SCAN") lines)"
          python3 .cu2-theater/tools/theater/test_theater_scan.py

      # BLOCKING. Fails only on theater this change introduced.
      - name: Theater gate (ratchet — new findings only)
        run: |
          set -euo pipefail
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # A first push to a branch, or a force-push, can leave `before` as the
          # null SHA. Fall back rather than skip — never let an unusual event
          # silently disable the gate.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "ratchet base: $BASE"
          python3 .cu2-theater/tools/theater/theater_scan.py . \
            --profile "${{ inputs.profile }}" --diff-base "$BASE" --tracked-only

      # NON-BLOCKING. Keeps the standing number visible so a green ratchet is
      # never mistaken for a clean repository.
      - name: Standing backlog (non-blocking)
        if: ${{ always() && inputs.report-backlog }}
        run: |
          python3 .cu2-theater/tools/theater/theater_scan.py . \
            --profile all --report --tracked-only --quiet \
            | tee -a "$GITHUB_STEP_SUMMARY"
